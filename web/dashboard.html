<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Trading Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-card .label {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .trades-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .trades-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .trades-header h2 {
            color: #333;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        .refresh-btn:hover {
            background: #5a67d8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f7f7f7;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .success-badge {
            background: #48bb78;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .failed-badge {
            background: #f56565;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .positive {
            color: #48bb78;
            font-weight: 600;
        }
        .negative {
            color: #f56565;
            font-weight: 600;
        }
        .signature-link {
            color: #667eea;
            text-decoration: none;
            font-family: monospace;
        }
        .signature-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Solana Trading Bot</h1>
            <p>Real-time dashboard for monitoring trading performance</p>
        </div>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3>Total Trades</h3>
                <div class="value" id="totalTrades">0</div>
                <div class="label">all time</div>
            </div>
            <div class="stat-card">
                <h3>Win Rate</h3>
                <div class="value" id="winRate">0%</div>
                <div class="label">successful trades</div>
            </div>
            <div class="stat-card">
                <h3>Net PnL</h3>
                <div class="value" id="netPnl">0 SOL</div>
                <div class="label">after fees</div>
            </div>
            <div class="stat-card">
                <h3>Best Trade</h3>
                <div class="value" id="bestTrade">0 SOL</div>
                <div class="label">highest profit</div>
            </div>
        </div>

        <div class="trades-section">
            <div class="trades-header">
                <h2>Recent Trades</h2>
                <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Signature</th>
                            <th>Strategy</th>
                            <th>Input</th>
                            <th>Output</th>
                            <th>Amount</th>
                            <th>PnL</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tradesList">
                        <tr><td colspan="8" class="loading">Loading trades...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('totalTrades').textContent = stats.total_trades || 0;
                document.getElementById('winRate').textContent = (stats.win_rate || 0).toFixed(1) + '%';
                document.getElementById('netPnl').textContent = (stats.net_pnl_sol || 0).toFixed(4) + ' SOL';
                document.getElementById('bestTrade').textContent = (stats.best_trade_sol || 0).toFixed(4) + ' SOL';
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        async function fetchTrades() {
            try {
                const response = await fetch('/api/trades');
                const data = await response.json();
                const trades = data.trades || [];
                
                const tbody = document.getElementById('tradesList');
                if (trades.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="loading">No trades yet</td></tr>';
                    return;
                }

                tbody.innerHTML = trades.map(trade => {
                    const date = new Date(trade.timestamp);
                    const timeStr = date.toLocaleString();
                    const pnlClass = trade.pnl >= 0 ? 'positive' : 'negative';
                    const pnlStr = (trade.pnl >= 0 ? '+' : '') + trade.pnl.toFixed(4) + ' SOL';
                    const statusClass = trade.success ? 'success-badge' : 'failed-badge';
                    const statusText = trade.success ? 'Success' : 'Failed';
                    
                    return `
                        <tr>
                            <td>${timeStr}</td>
                            <td><a href="https://solscan.io/tx/${trade.signature}" target="_blank" class="signature-link">${trade.signature.slice(0, 8)}...</a></td>
                            <td>${trade.strategy}</td>
                            <td>${trade.input_token.slice(0, 4)}...${trade.input_token.slice(-4)}</td>
                            <td>${trade.output_token.slice(0, 4)}...${trade.output_token.slice(-4)}</td>
                            <td>${trade.input_amount.toFixed(4)} SOL</td>
                            <td class="${pnlClass}">${pnlStr}</td>
                            <td><span class="${statusClass}">${statusText}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error fetching trades:', error);
                document.getElementById('tradesList').innerHTML = '<tr><td colspan="8" class="loading">Error loading trades</td></tr>';
            }
        }

        async function refreshData() {
            await Promise.all([fetchStats(), fetchTrades()]);
        }

        // Initial load
        refreshData();
        
        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
