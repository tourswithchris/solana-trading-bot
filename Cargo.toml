[package]
name = "trading-bot"
version = "5.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dotenv = "0.15"
tokio = { version = "1", features = ["full", "time"] }

# Keep Solana aligned and simple for Phase 1–3
solana-client = "1.16.27"
solana-sdk = "1.16.27"

# For WebSocket JSON parsing (Phase 3)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
chrono = "0.4.43"
rand = "0.8.5"
indicatif = "0.18.4"
clap = { version = "4.5.60", features = ["derive"] }
spl-token = "4.0.0"
spl-token-2022 = "0.9.0"
spl-token-client = "0.7.1"
url = "2.5.8"
solana-pubsub-client = "1.18.26"
solana-rpc-client-api = "1.18.26"
tokio-stream = "0.1.18"
solana-transaction-status = "1.18.26"
reqwest = { version = "0.11.27", features = ["json"] }
rusqlite = { version = "0.38.0", features = ["chrono"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
